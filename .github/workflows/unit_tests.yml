name: Unit tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  python_checks:
    name: Python lint and type checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run Python checks
        run: |
          make -C tests python-checks

  unit_tests:
    name: Run unit tests
    needs:
      - python_checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcmocka-dev

      - name: Run unit test workflow wrapper
        run: |
          make -C tests tests-unit
